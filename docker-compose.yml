# No top-level `version:` key — obsolete in Compose Specification v2+, emits a deprecation warning.
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: savez
      POSTGRES_PASSWORD: savez
      POSTGRES_DB: savez
    ports:
      - "5433:5432" # host port 5433: 5432 is taken by a native Windows PostgreSQL service on this
                     # machine (scoop-installed, unrelated to this project); container-internal port
                     # stays 5432. Dev-only convenience (psql, GUI tools); not published in production (Phase 8)
    volumes:
      # parent dir, not …/data — postgres:18 moved PGDATA to a versioned subpath
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U savez -d savez"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
